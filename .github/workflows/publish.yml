name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use Node.js LTS
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - name: Verify release tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Release tag ($TAG) does not match package.json version ($VERSION)" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Sanity-check build output
        run: node -e "require('./target/index.js'); require('fs').accessSync('./target/client/proto')"
      - name: Publish to npm
        run: npm publish --provenance ${{ github.event.release.prerelease && '--tag rc' || '' }}
