name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      # Constructing the proto client also proves the .proto files were copied.
      # The ESM line matters because named imports from our CommonJS output rely
      # on Node's static export detection, which is a heuristic, not a guarantee.
      - name: Check build output loads from CJS and ESM
        run: |
          node -e "const {TravelTimeProtoClient}=require('./dist/index.js'); new TravelTimeProtoClient({apiKey:'x',applicationId:'y'})"
          node --input-type=module -e "import {TravelTimeProtoClient} from './dist/index.js'; new TravelTimeProtoClient({apiKey:'x',applicationId:'y'})"

  # Separate from the matrix so the live API is hit once, not once per Node version.
  integration:
    runs-on: ubuntu-latest
    needs: build
    env:
      APP_ID: ${{ secrets.APP_ID }}
      API_KEY: ${{ secrets.API_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use Node.js LTS
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration
